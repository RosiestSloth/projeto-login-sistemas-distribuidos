<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page-wrapper">
    <div class="left-panel">
      <div class="form-card">

        <!-- Avatar -->
        <div class="avatar-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
        </div>

        <!-- Título -->
        <h2 class="heading">Entrar com sua conta</h2>

        <!-- Formulário -->
        <div class="form-body">
          <form id="loginForm">
            <div class="form-fields">

              <div class="field-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="seu usuario" required
                  autocomplete="username" />
              </div>

              <div class="field-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                  autocomplete="current-password" />
              </div>

            </div>

            <button type="submit" class="btn-submit">Entrar</button>
          </form>

          <div id="mensagem"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const usernameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('password').value;
      const divMensagem = document.getElementById('mensagem');
      const btnSubmit = this.querySelector('button[type="submit"]');

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Entrando...';

      try {
        const resposta = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const dados = await resposta.json();

        divMensagem.className = '';
        divMensagem.style.display = 'block';

        if (resposta.status === 200) {
          divMensagem.textContent = dados.mensagem;
          divMensagem.classList.add('sucesso');
        } else {
          divMensagem.textContent = dados.mensagem;
          divMensagem.classList.add('erro');
        }
      } catch (erro) {
        divMensagem.className = 'erro';
        divMensagem.style.display = 'block';
        divMensagem.textContent = 'Erro ao conectar com o servidor.';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
